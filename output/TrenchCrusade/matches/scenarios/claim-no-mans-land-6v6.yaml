# Trench Crusade — Playable match: Claim No Man's Land, 6v6
#
# Inline-stats variant of match-template.yaml. Each model carries its full
# profile + equipment stats so CLI/AI never have to look up the warband file
# during play. Schema additions vs match-template.yaml:
#   - model.M / RC / CC / defense_mod / keywords  (flat inline stat block)
#   - model.weapons.{ranged, melee, melee_off_hand}  (structured weapon dicts)
#   - model.armour_note  (free-text reminder of what got baked into defense_mod)
#
# Reference: matches/roster-template.md §7 (Red) + §8 (Blue) trimmed to 6+6
# (the legal minimum, plan §B.5 #2). Stats sourced from:
#   - warbands/01-new-antioch.md §Lieutenant / Sniper Priest / Shock Trooper / Yeoman
#   - warbands/02-heretic-legions.md §Heretic Priest / Death Commando / Heretic Trooper / Wretched
#   - rules/05-battlekit.md §Bolt-Action Rifle / Shotgun / Sniper Rifle / Silenced Pistol /
#                          Sword/Axe / Bayonet / Trench Knife / Trench Club /
#                          Standard Armour / Combat Helmet / Trench Shield / Infernal Brand
#
# DEFENSE_MOD COMPUTATION (PDF p.46-48):
#   defense_mod = profile.AC + sum(armour.injury_mod) + sum(shield.injury_mod)
#   (Combat Engineer's profile.AC=-2 already bakes in Engineer Body Armour;
#    similar Anointed Heavy Infantry. The PDF p.80 caveat — "do not apply
#    twice" — is honored by pre-aggregating here.)
#   Sign: negative = harder to wound. AI passes weapon.injury_mod + target.defense_mod
#         to roll_injury(modifier=...).

# -----------------------------------------------------------------------------
